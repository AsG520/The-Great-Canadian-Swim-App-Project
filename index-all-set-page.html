<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-all-set-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>All Set Page: The Great Canadian Swim App - 2026</title>
  </head>
  <body>
    <div class="container">
      <h1 id="whats-your-reason-for-swimming-word">
        <span aria-hidden="true">✨</span> You're all set!
      </h1>
      <h4 id="description">Let's make waves together.</h4>
      <img
        src="loader-logo.png"
        width="120"
        height="100"
        id="login-page-logo-circle"
        alt="Picture of Great Canadian Swim logo."
      />
      <div id="customAlert" class="alertBox">
        <label id="alertText"></label>
      </div>
      <div class="area">
        <div class="summary-card-reason">
          <br />
          <label class="title"
            ><span aria-hidden="true">💭</span> Your Reason</label
          >
          <br />
          <label id="your-Reason-Text">N/A</label>
        </div>
        <br />
        <div class="summary-card-goal">
          <label class="title"><span aria-hidden="true">🎯</span> Goal</label
          ><br />
          <label id="subtitle">N/A</label>
        </div>
      </div>
      <input
        type="button"
        id="gotohome"
        value="🏘️ Go to Home"
        aria-label="Go to home."
      />
    </div>
    <script type="module" src="function-all-set-page.js"></script>
    <script src="chatbase.js"></script>
  </body>
</html>
