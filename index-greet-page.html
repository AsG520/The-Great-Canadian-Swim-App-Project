<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-greet-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>Greet Page: The Great Canadian Swim App - 2026</title>
  </head>
  <body>
    <div class="container">
      <h1 id="greeting">
        Good Morning, Amanjot !<span aria-hidden="true">👋</span>
      </h1>
      <div id="day-number-and-calendar-layout">
        <h2 id="day-number"><span aria-hidden="true">⏳</span> Day #0</h2>
        <button
          id="dateButton"
          type="button"
          aria-label="Select a date."
        ></button>
        <input
          type="date"
          id="dateSelected"
          readonly
          aria-label="Select a date."
        />
      </div>
      <label><span aria-hidden="true">✍️</span> Today's Quote!</label>
      <br />
      <label id="word-quote-box">"Quote - Stephanie Manica"</label>
      <br />
      <br />
      <div id="user-stats-details">
        <div id="exp-details">
          <label id="exp-word"><span aria-hidden="true">⚡</span> Exp</label>
          <input
            type="text"
            id="exp"
            value="0"
            readonly
            aria-label="Experience points."
          />
        </div>
        <div id="level-details">
          <label id="level-word"
            ><span aria-hidden="true">💎</span> Level</label
          >
          <input
            type="text"
            id="level"
            value="0"
            readonly
            aria-label="Level."
          />
        </div>
        <div id="streak-details">
          <label id="streak-word"
            ><span aria-hidden="true">🔥</span> Streak</label
          >
          <input
            type="text"
            id="streak"
            value="0"
            readonly
            aria-label="Streak."
          />
        </div>
      </div>
    </div>
    <script type="module" src="function-greet-page.js"></script>
  </body>
</html>
