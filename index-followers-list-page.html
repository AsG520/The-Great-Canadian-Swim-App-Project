<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-followers-list-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>Followers List Page: The Great Canadian Swim App - 2026</title>
  </head>
  <body>
    <div class="container">
      <br />
      <h1>Followers</h1>
      <br />
      <template id="profile-template">
        <a class="profile-card">
          <img
            class="profile-pfp"
            src="profile-picture.png"
            alt="Profile picture"
          />
          <div class="profile-info">
            <div class="profile-username"></div>
            <div class="profile-details"></div>
          </div>
          <div class="profile-arrow">›</div>
        </a>
      </template>
      <div id="profiles"></div>
      <br />
      <input type="button" value="⬅️ Back" id="back" aria-label="Back." />
    </div>
    <script type="module" src="function-followers-list-page.js"></script>
  </body>
</html>
