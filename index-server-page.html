<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style-server-page.css" />
    <link rel="shortcut icon" href="logo.png" />
    <title>Server Page: The Great Canadian Swim App - 2026</title>
  </head>
  <body>
    <div id="message-container"></div>
    <form id="send-container">
      <div id="message-input-and-send-button-layout">
        <div id="message-input-and-control-panel">
          <input
            type="text"
            id="message-input"
            aria-label="Enter your message."
          />
          <div id="rules-and-dark-mode-layout">
            <input
              type="button"
              value="🚨 Rules"
              id="server-rules"
              aria-label="Server rules."
            />
            <div id="mode-layout">
              <img src="dark.png" id="dark-mode" alt="Dark mode icon." />
              <img src="sun.png" id="light-mode" alt="Light mode icon." />
              <img
                src="regular.png"
                id="regular-mode"
                alt="Regular mode icon."
              />
            </div>
          </div>
        </div>
        <div id="button-layout">
          <button type="submit" id="send-button" aria-label="Send message.">
            <span aria-hidden="true">📤</span> Send
          </button>
          <input
            type="button"
            id="exit-button"
            value="🚪 Exit"
            aria-label="Exit server."
          />
        </div>
      </div>
    </form>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="function-server-page.js"></script>
  </body>
</html>
