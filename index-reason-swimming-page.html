<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-reason-swimming-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>Reason Swimming Page: The Great Canadian Swim App - 2026</title>
  </head>
  <div class="container">
    <h1 id="whats-your-reason-for-swimming-word">
      <span aria-hidden="true">🔍</span> What's your<br />reason for swimming?
    </h1>
    <h4 id="description">
      Your "why" is what keeps you
      <br />
      going when it gets tough.
    </h4>
    <img
      src="loader-logo.png"
      width="120"
      height="100"
      id="reason-swimming-logo"
      alt="Picture of Great Canadian Swim logo."
    />
    <div id="customAlert" class="alertBox">
      <label id="alertText"></label>
    </div>
    <br />
    <label id="write-your-reason-word"
      ><span aria-hidden="true">✍</span> Write your reason</label
    >
    <input
      type="text"
      id="reason"
      maxlength="29"
      aria-label="Enter your reason."
      placeholder="Enter you reason"
    />
    <br />
    <div class="profile-details">
      <div id="private-details">
        <input
          type="checkbox"
          aria-label="Keep reason private on profile."
          id="private-checkbox"
        />
        <label id="profile-private">
          <span aria-hidden="true">🌎</span> This will be displayed private on
          your profile.
        </label>
      </div>
    </div>
    <br />
    <input
      type="button"
      id="continue"
      value="➡️ Continue"
      aria-label="Continue."
    />
  </div>
  <script type="module" src="function-reason-swimming-page.js"></script>
</body>
</html>
