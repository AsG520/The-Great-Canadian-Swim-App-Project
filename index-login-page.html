<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>Login Page: The Great Canadian Swim App - 2026</title>
    <link rel="stylesheet" href="style-login-page.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="login-word">Login</h1>
      <img
        src="loader-logo.png"
        width="120"
        height="100"
        id="login-page-logo"
        alt="Picture of Great Canadian Swim logo."
      />
      <div id="username-details">
        <div id="customAlert" class="alertBox">
          <label id="alertText"></label>
        </div>
        <div class="username-header">
          <label id="username-word"
            ><span aria-hidden="true">📧</span> Email</label
          >
          <img
            id="user-picture"
            src="user-picture.png"
            height="25"
            width="25"
            alt="Picture of user logo."
          />
        </div>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          aria-label="Enter your email."
          required
        />
      </div>
      <br />
      <div id="password-details">
        <div class="password-header">
          <label id="password-word"
            ><span aria-hidden="true">🔒</span> Password</label
          >
          <img
            id="padlock-picture"
            src="padlock-picture.png"
            height="25"
            width="25"
            alt="Picture of lock logo."
          />
        </div>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          aria-label="Enter your password."
        />
      </div>
      <h4 id="forgot-password-word">
        <span aria-hidden="true">🔑</span> Forgot Password?
      </h4>
      <input
        type="button"
        id="submitSignIn"
        value="🔓 Login"
        aria-label="Login."
      />
      <div id="registration-details">
        <h4 id="sentence-register">
          Don't have an account?
          <br />
          <span id="register-word">🔐 Register</span>
        </h4>
      </div>
      <br />
      <img
        src="google-logo.png"
        height="  35"
        width="35"
        id="googleSignIn"
        alt="Picture of Google logo."
      />
    </div>
    <script type="module" src="firebaseauth.js"></script>
    <script src="function-login-page.js"></script>
    <script src="chatbase.js"></script>
  </body>
</html>
