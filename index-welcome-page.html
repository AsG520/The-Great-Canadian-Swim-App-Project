<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>Welcome Page: The Great Canadian Swim App - 2026</title>
    <link rel="stylesheet" href="style-welcome-page.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="about-you-word"><span aria-hidden="true">👋</span> Welcome!</h1>
      <h4 id="description">
        You're part of something
        <br />
        bigger.
      </h4>
      <div class="header-pictures">
        <img
          src="map-of-canada.png"
          width="170"
          height="160"
          id="map-of-canada-picture"
          alt="Picture of Canada map."
        />
        X
        <img
          src="loader-logo.png"
          width="120"
          height="100"
          id="welcome-page-logo"
          alt="Picture of Great Canadian Swim logo."
        />
      </div>
      <br />
      <button
        type="button"
        id="swim-across-canada-option"
        aria-label="Swim across Canada."
      >
        <span aria-hidden="true">🌍</span> Swim across Canada
      </button>
      <br />
      <button
        type="button"
        id="build-community-option"
        aria-label="Build community."
      >
        <span aria-hidden="true">⛏️</span> Build Community
      </button>
      <br />
      <button
        type="button"
        id="make-a-difference-option"
        aria-label="Make a difference."
      >
        <span aria-hidden="true">🥇</span> Make a Difference
      </button>
      <br />
      <button
        type="button"
        id="create-an-account"
        aria-label="Create an account."
      >
        <span aria-hidden="true">🪪</span> Create an Account
      </button>
      <br />
      <button type="button" id="sign-in" aria-label="Sign in.">
        <span aria-hidden="true">✨</span> Sign In
      </button>
    </div>
    <script src="function-welcome-page.js"></script>
    <script src="chatbase.js"></script>
  </body>
</html>
