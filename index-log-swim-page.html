<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-log-swim-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>Log Swim Page: The Great Canadian Swim App - 2026</title>
  </head>
  <body>
    <div id="settings-box" title="Settings">
      <span aria-hidden="true" style="font-size: 35px">⚙️</span>
    </div>
    <div class="container">
      <h1><span aria-hidden="true">📃</span> Log Your<br />Swim</h1>
      <img
        src="loader-logo.png"
        width="120"
        height="100"
        id="log-swim-logo"
        alt="Picture of Great Canadian Swim logo."
      />
      <br />
      <label><span aria-hidden="true">❤️</span> How was your swim?</label>
      <div class="face-pictures-top">
        <figure>
          <input
            type="radio"
            name="face"
            id="great"
            value="Great"
            aria-label="Great."
          />
          <label for="great" class="face-label">
            <img
              src="great-face.png"
              height="50"
              width="50"
              id="great-picture"
              alt="Picture of great face."
            />
            <figcaption>Great</figcaption>
          </label>
        </figure>
        <figure>
          <input
            type="radio"
            name="face"
            id="good"
            value="Good"
            aria-label="Good."
          />
          <label for="good" class="face-label">
            <img
              src="good-face.png"
              height="50"
              width="50"
              id="good-pict ure"
              alt="Picture of good face."
            />
            <figcaption>Good</figcaption>
          </label>
        </figure>
      </div>
      <div class="face-pictures-bottom">
        <figure>
          <input
            type="radio"
            name="face"
            id="okay"
            value="Okay"
            aria-label="Okay."
          />
          <label for="okay" class="face-label">
            <img
              src="okay-face.png"
              height="50"
              width="50"
              id="okay-picture"
              alt="Picture of okay face."
            />
            <figcaption>Okay</figcaption>
          </label>
        </figure>
        <figure>
          <input
            type="radio"
            name="face"
            id="tough"
            value="Tough"
            aria-label="Tough."
          />
          <label for="tough" class="face-label">
            <img
              src="tough-face.png"
              height="50"
              width="50"
              id="tough-picture"
              alt="Picture of tough face."
            />
            <figcaption>Tough</figcaption>
          </label>
        </figure>
      </div>
      <br />
      <label><span aria-hidden="true">🏁</span> Distance</label>
      <div id="distance-details">
        <input
          type="number"
          id="distance"
          oninput="this.value = Math.abs(this.value)"
          min="0"
          placeholder="Enter distance swam"
          aria-label="Enter distance swam."
        />
        <select id="unit-details">
          <option value="Meters" id="meters-option">m</option>
          <option selected value="Kilometers" id="kilometers-option">km</option>
        </select>
      </div>
      <br />
      <label><span aria-hidden="true">⌚</span> Time</label>
      <div id="time-details">
        <input
          type="number"
          id="time"
          oninput="this.value = Math.abs(this.value)"
          min="0"
          placeholder="Enter time swam"
          aria-label="Enter time swam."
        />
        <select id="unit-details">
          <option value="Minutes" id="minutes-option">min</option>
          <option selected value="Hours" id="hours-option">hrs</option>
        </select>
      </div>
      <br />
      <label><span aria-hidden="true">📍</span> Where did you swim?</label>
      <div class="button-layout">
        <input
          type="radio"
          name="whereswam"
          id="pool"
          value="Pool"
          aria-label="Button - Pool."
        />
        <label for="pool" class="whereswamlabel"
          ><span aria-hidden="true">🏊</span> Pool</label
        >
        <input
          type="radio"
          name="whereswam"
          id="open-water"
          value="Open Water"
          aria-label="Button - Open water."
        />
        <label for="open-water" class="whereswamlabel"
          ><span aria-hidden="true">💦</span> Open Water</label
        >
      </div>
      <br />
      <label><span aria-hidden="true">📓</span> Notes (optional)</label>
      <input
        type="text"
        id="notes"
        placeholder="Enter your notes"
        maxlength="30"
        aria-label="Enter your notes."
      />
      <br />
      <button type="button" id="save-swim" aria-label="Save swim.">
        <span aria-hidden="true">📥</span> Save Swim
      </button>
    </div>
    <br />
    <nav class="navbar">
      <ul>
        <li>
          <a href="index-main-page.html" title="Home"
            ><span aria-hidden="true">🏠</span></a
          >
        </li>
        <li>
          <a href="index-log-swim-page.html" title="Log Swim"
            ><span aria-hidden="true">✏️</span></a
          >
        </li>
        <li>
          <a href="index-date-tracker-distance-daily.html" title="Date Trackers"
            ><span aria-hidden="true">⏳</span></a
          >
        </li>
        <li>
          <a href="index-badge-page.html" title="Badges"
            ><span aria-hidden="true">🏆</span></a
          >
        </li>
        <li>
          <a href="index-join-server-page.html" title="Server"
            ><span aria-hidden="true">💬</span></a
          >
        </li>
        <li>
          <a href="index-search-page.html" title="Search"
            ><span aria-hidden="true">🔍</span></a
          >
        </li>
        <li>
          <a href="index-weather-page.html" title="Weather"
            ><span aria-hidden="true">☀️</span></a
          >
        </li>
      </ul>
    </nav>
    <script type="module" src="function-log-swim-page.js"></script>
    <script src="chatbase.js"></script>
  </body>
</html>
