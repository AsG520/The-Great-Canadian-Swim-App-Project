<!doctype html>

  <head>
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>
    <script type="text/javascript">
      google.charts.load("current", { packages: ["bar"] });

      function drawStuff(monthlyDistances) {
        var data = new google.visualization.arrayToDataTable([
          ["", "Distance"],
          ["Jan", monthlyDistances[0]],
          ["Feb", monthlyDistances[1]],
          ["Mar", monthlyDistances[2]],
          ["Apr", monthlyDistances[3]],
          ["May", monthlyDistances[4]],
          ["Jun", monthlyDistances[5]],
          ["Jul", monthlyDistances[6]],
          ["Aug", monthlyDistances[7]],
          ["Sep", monthlyDistances[8]],
          ["Oct", monthlyDistances[9]],
          ["Nov", monthlyDistances[10]],
          ["Dec", monthlyDistances[11]],
        ]);

        var options = {
          width: 300,
          legend: { position: "none" },
          chart: {
            title: "Yearly Distance (km)",
            subtitle: "Your distance by month across the year.",
          },
          bar: { groupWidth: "90%" },
        };

        var chart = new google.charts.Bar(document.getElementById("top_x_div"));
        chart.draw(data, google.charts.Bar.convertOptions(options));
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-date-tracker-distance-yearly.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>
      <br />
      <select id="date-tracker-details">
        <option selected disabled>
          <span aria-hidden="true">📊</span> Select your data
        </option>
        <option id="distance-option" value="Distance">Distance</option>
        <option id="duration-option" value="Duration">Duration</option>
        <option id="session-option" value="Session">Session</option>

      <nav class="navbar-data-panel">

          <li>

          </li>
          <li>

            >
          </li>
          <li>

        </ul>

      <br />
      <div id="top_x_div" style="width: 1000px; height: 300px"></div>
      <br />
      <div id="forward-and-back-details">

          src="back.png"

          width="25"

        <a href="index-history-page.html"

      <br />
      <label id="total-distance-word"
        ><span aria-hidden="true">🏊🏻‍♂️</span> Total Distance</label
      >
      <div id="distance-details">
        <input
          type="number"
          id="total-distance"
          readonly
          value="20"
          aria-label="Total distance."
        />
        <select id="unit-details">
          <option value="Meters" id="meters-option">m</option>
          <option selected value="Kilometers" id="kilometers-1option">
            km
          </option>
        </select>
      </div>
      <br />
      <label id="average-distance-word"
        ><span aria-hidden="true">⚖️</span> Average Distance</label
      >
      <div id="average-distance-details">
        <input
          type="number"
          id="average-distance"
          readonly
          value="10"
          aria-label="Average distance."
        />
        <select id="average-unit-details">
          <option value="Meters" id="meters-option">m</option>
          <option selected value="Kilometers" id="kilometers-option">km</option>
