<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-user-credentials.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>User Credentials Page: The Great Canadian Swim App - 2026</title>
  </head>
  <body>
    <div class="container">
      <h1 id="user-credentials-word">📄 User Credentials</h1>
      <img
        src="loader-logo.png"
        width="120"
        height="100"
        id="user-credentials-logo"
        alt="Picture of Great Canadian Swim logo."
      />
      <br />
      <div id="customAlert" class="alertBox">
        <label id="alertText"></label>
      </div>
      <div class="name-details">
        <label id="username-word"
          ><span aria-hidden="true">📄</span> Username</label
        >
        <input
          type="text"
          id="username"
          placeholder="Enter your username"
          aria-label="Enter your username."
        />
      </div>
      <br />
      <label id="location-word"
        ><span aria-hidden="true">🗺️</span> Location</label
      >
      <select id="location-details" aria-label="Select your location.">
        <option selected disabled>Select your location</option>
        <option>Alberta</option>
        <option>British Columbia</option>
        <option>Manitoba</option>
        <option>New Brunswick</option>
        <option>Newfoundland and Labrador</option>
        <option>Nova Scotia</option>
        <option>Ontario</option>
        <option>Prince Edward Island</option>
        <option>Quebec</option>
        <option>Saskatchewan</option>
        <option>Northwest Territories</option>
        <option>Nunavut</option>
        <option>Yukon</option>
      </select>
      <br />
      <label id="age-word"><span aria-hidden="true">🔢</span> Age</label>
      <input
        type="number"
        id="age-number"
        placeholder="Enter your age"
        min="0"
        max="120"
        alt="Textbox of age."
        oninput="this.value = Math.abs(this.value)"
        aria-label="Enter your age."
      />
      <br />
      <label id="gender-word"><span aria-hidden="true">🚻</span> Gender</label>
      <select id="gender-details" aria-label="Select your gender.">
        <option selected disabled>Select your gender</option>
        <option>Female</option>
        <option>Male</option>
        <option>Non-Binary</option>
        <option>Other</option>
        <option>Prefer Not to Say</option>
      </select>
      <br />
      <label id="height-word"><span aria-hidden="true">📏</span> Height</label>
      <input
        type="number"
        id="height-details"
        placeholder="Enter your height in centimeters"
        min="0"
        oninput="this.value = Math.abs(this.value)"
        aria-label="Enter your height in centimeters."
      />
      <br />
      <label id="weight-word"><span aria-hidden="true">💪</span> Weight</label>
      <input
        type="number"
        id="weight-details"
        min="0"
        placeholder="Enter your weight in pounds"
        aria-label="Enter your weight in pounds."
        oninput="this.value = Math.abs(this.value)"
      />
      <br />
      <button type="button" id="submit" aria-label="Submit.">
        <span aria-hidden="true">☑️</span> Submit
      </button>
    </div>
    <script type="module" src="function-user-credentials.js"></script>
  </body>
</html>
