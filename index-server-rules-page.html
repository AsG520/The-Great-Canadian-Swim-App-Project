<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-server-rules-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>Server Rules Page: The Great Canadian Swim App - 2026</title>
  </head>
  <body>
    <div class="container">
      <h1>
        <span aria-hidden="true">🔨</span> Server Rules
        <span aria-hidden="true">📄</span>
      </h1>
      <img
        src="loader-logo.png"
        width="120"
        height="100"
        id="server-rules-logo"
        alt="Picture of Great Canadian Swim logo."
      />
      <br />
      <h3><span aria-hidden="true">1️⃣</span> Rule No.1</h3>
      <label
        >Be respectful: Treat others with kindness, courtesy, and respect.
        Harassment, hate speech, discrimination, or any form of offensive
        behaviour will not be tolerated.</label
      >
      <br />
      <h3><span aria-hidden="true">2️⃣</span> Rule No.2</h3>
      <label>
        No spamming: Avoid excessive posting of repetitive or irrelevant
        content. This includes flooding chat, excessive use of emojis, or
        sending unsolicited private messages to members.
      </label>
      <br />
      <h3><span aria-hidden="true">3️⃣</span> Rule No.3</h3>
      <label
        >Keep discussions appropriate: Refrain from sharing explicit, adult, or
        NSFW (Not Safe for Work) content. Keep discussions and media within the
        server's designated channels and content guidelines.
      </label>
      <br />
      <h3><span aria-hidden="true">4️⃣</span> Rule No.4</h3>
      <label
        >No personal attacks or bullying: Do not engage in personal attacks,
        cyberbullying, or targeted harassment towards other members.
        Disagreements are acceptable, but keep discussions civil and
        constructive.</label
      >
      <br />
      <h3><span aria-hidden="true">5️⃣</span> Rule No.5</h3>
      <label
        >Respect privacy and confidentiality: Do not share personal information
        about others without their consent. Respect the privacy of all members
        and avoid sharing sensitive or confidential information in public
        channels.</label
      >
      <br />
      <h3><span aria-hidden="true">6️⃣</span> Rule No.6</h3>
      <label
        >Follow The Great Canadian Swim's Terms of Service: Abide by the The
        Great Canadian Swim Community Guidelines and Terms of Service. Any
        violations may result in disciplinary action or removal from the server.
      </label>
      <br />
      <h3><span aria-hidden="true">7️⃣</span> Rule No.7</h3>
      <label
        >No advertising or self-promotion: Do not use the server to promote
        external websites, products, or services without prior permission from
        the server moderators. Self-promotion is only allowed in designated
        channels if permitted (e.g. project-promo).
      </label>
      <br />
      <h3><span aria-hidden="true">8️⃣</span> Rule No.8</h3>
      <label
        >Use appropriate language: Avoid excessive profanity, vulgar language,
        or excessive use of caps. Maintain a friendly and inclusive environment
        for all members.
      </label>
      <br />
      <h3><span aria-hidden="true">9️⃣</span> Rule No.9</h3>
      <label
        >Use channels as intended: Post content in the appropriate channels and
        avoid off-topic discussions. If you're unsure where to post, ask a
        moderator for guidance.</label
      >
      <br />
      <br />
      <input
        type="button"
        value="☑️ Agree"
        id="agree-rules"
        aria-label="Agree to server rules."
      />
    </div>
    <script src="function-server-rules-page.js"></script>
  </body>
</html>
