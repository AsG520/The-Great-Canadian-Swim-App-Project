<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="logo.png" />
    <title>About You Page: The Great Canadian Swim App - 2026</title>
    <link rel="stylesheet" href="style-about-you-page.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="about-you-word">
        <span aria-hidden="true">💭</span> Tell Us About You
      </h1>
      <h4 id="description">
        This helps us personalize<br />
        your experience.
      </h4>
      <img
        src="loader-logo.png"
        width="120"
        height="100"
        id="about-you-logo"
        alt="Picture of Great Canadian Swim logo."
      />
      <div id="customAlert" class="alertBox">
        <label id="alertText"></label>
      </div>
      <br />
      <div class="disability-details">
        <input
          type="checkbox"
          id="disability-checkbox"
          aria-label="I live with a disability."
        />
        <input
          type="button"
          value="♿ I live with a Disability"
          id="disability-option"
          aria-label="I live with a disability."
        />
      </div>
      <br />
      <div class="parent-caregiver-details">
        <input
          type="checkbox"
          id="parent-caregiver-checkbox"
          aria-label="I am a parent / caregiver."
        />
        <input
          type="button"
          value="👪 I am a Parent / Caregiver"
          id="parent-caregiver-option"
          aria-label="I am a parent / caregiver."
        />
      </div>
      <br />
      <div class="supporter-details">
        <input
          type="checkbox"
          id="supporter-checkbox"
          aria-label="I am a supporter."
        />
        <input
          type="button"
          value="🤝 I am a Supporter"
          id="supporter-option"
          aria-label="I am a supporter."
        />
      </div>
      <br />
      <div class="club-coach-details">
        <input
          type="checkbox"
          id="club-coach-checkbox"
          aria-label="Swim club / coach."
        />
        <input
          type="button"
          value="🏊‍♂️ Swim Club / Coach"
          id="club-coach-option"
          aria-label="Swim club / coach."
        />
      </div>
      <br />
      <div class="education-details">
        <input
          type="checkbox"
          id="education-checkbox"
          aria-label="School / student."
        />
        <input
          type="button"
          value="🎓 School / Student"
          id="education-option"
          aria-label="School / student."
        />
      </div>
      <br />
      <div class="organization-details">
        <input
          type="checkbox"
          id="organization-checkbox"
          aria-label="Corporate / organization."
        />
        <input
          type="button"
          value="🏢 Corporate / Organization"
          id="organization-option"
          aria-label="Corporate / organization."
        />
      </div>
      <br />
      <input
        type="button"
        value="➡️ Continue"
        id="continue"
        aria-label="Continue."
      />
    </div>
    <script type="module" src="function-about-you-page.js"></script>
    <script src="chatbase.js"></script>
  </body>
</html>
